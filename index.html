<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Winnie's Choice: School or Stage?</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e1b4b, var(--bg));
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 { color: var(--primary); text-align: center; margin-bottom: 4px; font-size: 1.55rem; }
    .subtitle { text-align: center; color: var(--subtext); margin-bottom: 14px; font-size: 0.95rem; }
    .canvas-wrap { width: 100%; display: flex; justify-content: center; margin-bottom: 14px; }
    canvas { width: 100%; max-width: 550px; height: 160px; background: #090d16; border: 1px solid #334155; border-radius: 10px; }
    .status-bar { display: flex; justify-content: space-around; background: #0f172a; padding: 10px; border-radius: 10px; margin-bottom: 14px; font-size: 0.85rem; font-weight: 600; }
    .track-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; margin-bottom: 8px; }
    .badge-dropout { background: #7f1d1d; color: #fca5a5; }
    .badge-school { background: #075985; color: #bae6fd; }
    .badge-start { background: #312e81; color: #c7d2fe; }
    .story-card { background: #0b1329; border-radius: 10px; padding: 14px; margin-bottom: 14px; line-height: 1.6; border-left: 4px solid var(--primary); font-size: 0.98rem; }
    .feeling-box { background: #2e1065; border: 1px solid #7c3aed; color: #e9d5ff; border-radius: 8px; padding: 12px; margin-bottom: 14px; font-style: italic; font-size: 0.95rem; display: none; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    button { background: #334155; color: var(--text); border: 1px solid #475569; padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; cursor: pointer; text-align: left; line-height: 1.4; }
    button:hover { background: #0284c7; border-color: var(--primary); }
    .btn-action { background: var(--primary); color: #000; font-weight: bold; text-align: center; width: 100%; margin-top: 10px; }
    .btn-action:hover { background: #7dd3fc; }
  </style>
</head>
<body>
<div class="container" id="game-app"></div>

<script>
(function() {
  function drawCartoon(canvasId, sceneKey) {
    var c = document.getElementById(canvasId);
    if (!c) return;
    var ctx = c.getContext("2d");
    var w = c.width, h = c.height;
    ctx.fillStyle = "#090d16";
    ctx.fillRect(0, 0, w, h);

    function head(x, y, r, skin, hair, pony) {
      if (pony) { ctx.fillStyle = hair; ctx.beginPath(); ctx.ellipse(x + r*0.9, y - 2, r*0.35, r*0.7, 0, 0, 6.28); ctx.fill(); }
      ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(x, y, r+2, 0, 6.28); ctx.fill();
      ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(x, y+2, r, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#0f172a";
      ctx.beginPath(); ctx.arc(x-5, y+1, 2, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(x+5, y+1, 2, 0, 6.28); ctx.fill();
      ctx.strokeStyle = "#b91c1c"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y+5, 4, 0.2, 2.9); ctx.stroke();
    }

    if (sceneKey === "start") {
      ctx.fillStyle = "rgba(56,189,248,0.15)"; ctx.beginPath(); ctx.moveTo(40,0); ctx.lineTo(0,h); ctx.lineTo(120,h); ctx.fill();
      ctx.fillStyle = "rgba(244,63,94,0.15)"; ctx.beginPath(); ctx.moveTo(240,0); ctx.lineTo(160,h); ctx.lineTo(280,h); ctx.fill();
      ctx.fillStyle = "#3b82f6"; ctx.fillRect(35, 110, 45, 10);
      ctx.fillStyle = "#ec4899"; ctx.fillRect(38, 100, 38, 10);
      ctx.fillStyle = "#fff"; ctx.font = "bold 8px Arial"; ctx.fillText("DSE BOOKS", 40, 108);
      head(140, 52, 16, "#fed7aa", "#292524", true);
      ctx.fillStyle = "#f8fafc"; ctx.fillRect(128, 70, 24, 45);
      ctx.fillStyle = "#0284c7"; ctx.fillRect(138, 70, 4, 22);
      ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(185, 60); ctx.lineTo(185, 125); ctx.stroke();
      ctx.fillStyle = "#fbbf24"; ctx.beginPath(); ctx.arc(185, 55, 7, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#38bdf8"; ctx.font = "14px Arial"; ctx.fillText("♫", 200, 45);
    } else if (sceneKey === "1") {
      ctx.fillStyle = "#334155"; ctx.fillRect(20, 95, 240, 30);
      head(60, 52, 15, "#fbcfe8", "#475569", false);
      ctx.fillStyle = "#e11d48"; ctx.fillRect(48, 69, 24, 26);
      ctx.fillStyle = "#fda4af"; ctx.font = "bold 9px Arial"; ctx.fillText("Mom (Worried)", 35, 30);
      head(120, 48, 15, "#fed7aa", "#1e293b", false);
      ctx.fillStyle = "#1e3a8a"; ctx.fillRect(108, 65, 24, 30);
      ctx.fillStyle = "#93c5fd"; ctx.font = "bold 9px Arial"; ctx.fillText("Dad", 112, 26);
      head(190, 52, 15, "#fed7aa", "#292524", true);
      ctx.fillStyle = "#0284c7"; ctx.fillRect(178, 69, 24, 26);
      ctx.fillStyle = "#38bdf8"; ctx.font = "bold 9px Arial"; ctx.fillText("Winnie", 178, 30);
    } else if (sceneKey === "2") {
      ctx.strokeStyle = "#1e293b"; ctx.strokeRect(20, 20, 240, 110);
      ctx.strokeStyle = "#64748b"; ctx.beginPath(); ctx.moveTo(140,20); ctx.lineTo(140,45); ctx.stroke();
      ctx.fillStyle = "#fef08a"; ctx.beginPath(); ctx.arc(140, 50, 7, 0, 6.28); ctx.fill();
      head(110, 75, 14, "#fed7aa", "#292524", true);
      ctx.fillStyle = "#7f1d1d"; ctx.fillRect(180, 50, 60, 40);
      ctx.fillStyle = "#fca5a5"; ctx.font = "bold 9px Arial"; ctx.fillText("RENT DUE", 188, 68);
      ctx.fillText("$1,500", 192, 82);
    } else if (sceneKey === "3") {
      ctx.fillStyle = "#1e1b4b"; ctx.fillRect(190, 20, 50, 40);
      ctx.fillStyle = "#fef08a"; ctx.beginPath(); ctx.arc(215, 40, 9, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#334155"; ctx.fillRect(25, 90, 130, 30);
      ctx.fillStyle = "#f8fafc"; ctx.fillRect(35, 75, 50, 25);
      ctx.fillStyle = "#dc2626"; ctx.font = "bold 7px Arial"; ctx.fillText("ENGLISH EXAM", 38, 88);
      head(130, 70, 14, "#fed7aa", "#292524", true);
      ctx.fillStyle = "#d97706"; ctx.beginPath(); ctx.ellipse(150, 95, 10, 14, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#f87171"; ctx.font = "bold 9px Arial"; ctx.fillText("11:45 PM", 35, 40);
    } else if (sceneKey === "4") {
      ctx.fillStyle = "#334155"; ctx.fillRect(25, 80, 90, 45);
      ctx.fillStyle = "#f8fafc"; ctx.beginPath(); ctx.ellipse(70, 72, 20, 5, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#94a3b8"; ctx.font = "bold 8px Arial"; ctx.fillText("DISHWASHING", 40, 98);
      head(185, 55, 14, "#fed7aa", "#292524", true);
      ctx.fillStyle = "#f8fafc"; ctx.fillRect(145, 50, 48, 60);
      ctx.fillStyle = "#dc2626"; ctx.font = "bold 8px Arial"; ctx.fillText("REJECTED", 148, 75);
      ctx.fillStyle = "#475569"; ctx.font = "6px Arial"; ctx.fillText("NO F.6 DIPLOMA", 147, 90);
    } else if (sceneKey === "5") {
      ctx.fillStyle = "#0284c7"; ctx.fillRect(35, 55, 60, 35);
      ctx.fillStyle = "#fff"; ctx.font = "bold 8px Arial"; ctx.fillText("DSE PAPERS", 40, 72);
      ctx.fillText("$800", 55, 84);
      ctx.fillStyle = "#f43f5e"; ctx.font = "bold 13px Arial"; ctx.fillText("VS", 125, 76);
      ctx.fillStyle = "#fbbf24"; ctx.beginPath(); ctx.arc(195, 55, 12, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#94a3b8"; ctx.fillRect(193, 67, 4, 25);
      ctx.fillStyle = "#fbbf24"; ctx.font = "bold 8px Arial"; ctx.fillText("PRO MIC $800", 168, 105);
    } else if (sceneKey === "6") {
      head(65, 52, 15, "#fed7aa", "#0f172a", false);
      ctx.fillStyle = "#0f172a"; ctx.fillRect(52, 48, 26, 6);
      ctx.fillStyle = "#1e1b4b"; ctx.fillRect(53, 69, 24, 40);
      ctx.fillStyle = "#f8fafc"; ctx.fillRect(115, 25, 70, 95);
      ctx.fillStyle = "#b91c1c"; ctx.font = "bold 7px Arial"; ctx.fillText("8-YR CONTRACT", 118, 42);
      ctx.fillStyle = "#dc2626"; ctx.font = "7px Arial"; ctx.fillText("Agent takes 90%", 118, 65);
      head(215, 60, 14, "#fed7aa", "#292524", true);
      ctx.fillStyle = "#f87171"; ctx.font = "bold 14px Arial"; ctx.fillText("???", 208, 40);
    } else if (sceneKey === "7") {
      ctx.fillStyle = "#334155"; ctx.fillRect(25, 85, 110, 35);
      ctx.fillStyle = "#0284c7"; ctx.fillRect(60, 65, 36, 22);
      ctx.fillStyle = "#fff"; ctx.font = "bold 7px Arial"; ctx.fillText("SBA SLIDES", 63, 79);
      ctx.fillStyle = "#1e293b"; ctx.fillRect(175, 40, 60, 70);
      ctx.strokeStyle = "#f43f5e"; ctx.strokeRect(175, 40, 60, 70);
      ctx.fillStyle = "#f43f5e"; ctx.font = "bold 8px Arial"; ctx.fillText("CAFE GIG", 185, 56);
      ctx.fillStyle = "#fde047"; ctx.font = "bold 9px Arial"; ctx.fillText("$500 TODAY", 180, 75);
    } else if (sceneKey === "8") {
      ctx.fillStyle = "#fde047"; ctx.beginPath(); ctx.arc(220, 30, 12, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#0284c7"; ctx.beginPath(); ctx.moveTo(170,35); ctx.lineTo(190,43); ctx.lineTo(170,51); ctx.lineTo(150,43); ctx.fill();
      head(170, 63, 12, "#fbcfe8", "#1e293b", false);
      ctx.fillStyle = "#6ee7b7"; ctx.font = "bold 9px Arial"; ctx.fillText("Classmates Graduate!", 115, 25);
      head(50, 65, 13, "#fed7aa", "#292524", true);
      ctx.fillStyle = "#f87171"; ctx.fillRect(43, 80, 14, 25);
      ctx.fillStyle = "#94a3b8"; ctx.font = "8px Arial"; ctx.fillText("Winnie alone...", 28, 40);
    } else if (sceneKey === "9") {
      ctx.fillStyle = "#334155"; ctx.fillRect(25, 90, 120, 30);
      ctx.fillStyle = "#38bdf8"; ctx.fillRect(35, 70, 42, 18);
      ctx.fillStyle = "#fff"; ctx.font = "bold 6px Arial"; ctx.fillText("MOCK EXAM", 38, 82);
      head(110, 78, 13, "#fed7aa", "#292524", true);
      head(190, 52, 14, "#fbcfe8", "#475569", false);
      ctx.fillStyle = "#fbbf24"; ctx.beginPath(); ctx.ellipse(165, 88, 14, 7, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#fda4af"; ctx.font = "bold 9px Arial"; ctx.fillText("Mom: Warm Soup", 150, 35);
    } else if (sceneKey === "10") {
      ctx.fillStyle = "#0284c7"; ctx.beginPath(); ctx.moveTo(140,22); ctx.lineTo(160,30); ctx.lineTo(140,38); ctx.lineTo(120,30); ctx.fill();
      head(140, 50, 14, "#fed7aa", "#292524", true);
      ctx.fillStyle = "#f8fafc"; ctx.fillRect(148, 72, 22, 28);
      ctx.fillStyle = "#b45309"; ctx.font = "bold 5px Arial"; ctx.fillText("F.6 DIPLOMA", 150, 85);
      ctx.fillStyle = "#1e293b"; ctx.fillRect(20, 55, 70, 40);
      ctx.strokeStyle = "#38bdf8"; ctx.strokeRect(20, 55, 70, 40);
      ctx.fillStyle = "#fde047"; ctx.font = "bold 9px Arial"; ctx.fillText("STAGE 🎤", 30, 78);
      ctx.fillStyle = "#1e293b"; ctx.fillRect(190, 55, 70, 40);
      ctx.strokeStyle = "#34d399"; ctx.strokeRect(190, 55, 70, 40);
      ctx.fillStyle = "#a7f3d0"; ctx.font = "bold 8px Arial"; ctx.fillText("UNIVERSITY 🎓", 192, 78);
    }
  }

  var nodes = {
    "1": {
      track: "The Big Decision",
      badgeClass: "badge-start",
      title: "1. The Dinner Table Argument",
      story: "Winnie drops her heavy Form 4 bag on the floor. 'Mom, Dad, studying is so boring! I want to drop out right now to be a full-time singer.' Her parents are shocked and worried.",
      choiceA: {
        text: "Pack her bags and quit school right now to live alone.",
        feeling: "Winnie slams the door shut. She feels completely free, but seeing her mother cry leaves a deep ache in her heart.",
        music: 3, study: -4, family: -4,
        next: "2"
      },
      choiceB: {
        text: "Promise to stay in school until Form 6 and try to balance both.",
        feeling: "Her parents sigh with relief. Winnie is glad they are calm, but knows juggling homework and singing will be tough.",
        music: 1, study: 2, family: 2,
        next: "3"
      }
    },
    "2": {
      track: "Dropout Path (Alone)",
      badgeClass: "badge-dropout",
      title: "2. Finding Practice Space (No School Room)",
      story: "Without school music rooms, Winnie cannot practice in her tiny rented room because neighbors call the police about loud singing.",
      choiceA: {
        text: "Spend her last savings to rent a damp basement rehearsal room.",
        feeling: "She can sing freely, but checking her almost empty wallet makes her stomach churn with worry.",
        music: 3, study: -1, family: -1,
        next: "4"
      },
      choiceB: {
        text: "Sing for free under noisy public highway bridges.",
        feeling: "Strangers point and record videos on their phones. She feels embarrassed and misses home.",
        music: 1, study: 0, family: 0,
        next: "4"
      }
    },
    "4": {
      track: "Dropout Path (Alone)",
      badgeClass: "badge-dropout",
      title: "3. Job Hunting with No School Certificate",
      story: "Winnie has only $30 left for food. Every regular shop and cafe turns her down because she has no Form 6 graduation certificate.",
      choiceA: {
        text: "Work late-night dishwashing shifts for low pay in a back kitchen.",
        feeling: "Her hands are blistered and she is too tired to write songs, but at least she can buy instant noodles.",
        music: -1, study: -2, family: -1,
        next: "6"
      },
      choiceB: {
        text: "Skip meals to keep writing songs at home.",
        feeling: "Dizziness and hunger make her head ache, though she finishes two emotional demo tracks.",
        music: 2, study: -1, family: 0,
        next: "6"
      }
    },
    "6": {
      track: "Dropout Path (Alone)",
      badgeClass: "badge-dropout",
      title: "4. The Tricky Legal Contract",
      story: "A dishonest talent scout offers an 8-year contract with complex legal English words Winnie never learned in secondary school.",
      choiceA: {
        text: "Sign blindly because she needs money and cannot read legal English.",
        feeling: "She later discovers she gave away 90% of her earnings for 8 years. Panic and regret set in.",
        music: 1, study: -3, family: -2,
        next: "8"
      },
      choiceB: {
        text: "Walk away in fear because she cannot understand the legal terms.",
        feeling: "She protected herself, but sits on the street curb crying, wishing she had stayed in school.",
        music: 0, study: 0, family: 0,
        next: "8"
      }
    },
    "8": {
      track: "Dropout Path (Alone)",
      badgeClass: "badge-dropout",
      title: "5. Old Classmates' Graduation Day",
      story: "Photos show Winnie's former classmates smiling in graduation caps, holding university offers. Winnie is washing cafe tables.",
      choiceA: {
        text: "Block their accounts and stay bitter about schools and diplomas.",
        feeling: "A wave of regret hits Winnie. Passion alone without basic education leaves her with no safety net.",
        music: 1, study: -3, family: -2,
        next: "end_dropout_harsh"
      },
      choiceB: {
        text: "Swallow her pride, call her mother, and apologize for leaving.",
        feeling: "Her mother weeps over the phone: 'Winnie, come home. We will support your evening school.' Real warmth fills her chest.",
        music: 1, study: 2, family: 4,
        next: "end_dropout_reunion"
      }
    },
    "3": {
      track: "School Path (Balancing Act)",
      badgeClass: "badge-school",
      title: "2. Midnight Singing vs. English Test",
      story: "It is 11:30 PM. Winnie has an English exam tomorrow, but she is having fun writing a melody on guitar. Mom knocks looking annoyed: 'Winnie, it is midnight! Have you revised?'",
      choiceA: {
        text: "Choose Singing: Keep playing guitar until 1:30 AM and ignore mom's warning.",
        feeling: "Winnie writes a catchy song, but fails the English test with 38 marks. Her parents are furious and confiscate her guitar for a week!",
        music: 3, study: -3, family: -3,
        next: "5"
      },
      choiceB: {

        feeling: "Mom brings a warm cup of water: 'Thank you for being sensible.' Winnie scores 72 on the test and her mom smiles proudly.",
        music: -1, study: 3, family: 3,
        next: "5"
      }
    },
    "5": {
      track: "School Path (Balancing Act)",
      badgeClass: "badge-school",
      title: "3. DSE Past Papers vs. Studio Microphone",
      story: "Dad gives Winnie $800 to buy essential HKDSE past paper booklets. But at the mall, Winnie sees a limited-edition studio microphone on sale for exactly $800!",
      choiceA: {
        text: "Choose Singing: Secretly buy the microphone and hide it in her closet.",
        feeling: "Her song recordings sound crisp, but Dad finds out two weeks later. He looks deeply disappointed: 'We trusted you, Winnie.' The dinner table turns icy cold.",
        music: 3, study: -2, family: -3,
        next: "7"
      },
      choiceB: {

        music: -1, study: 3, family: 3,

      }
    },
    "7": {
      track: "School Path (Balancing Act)",
      badgeClass: "badge-school",
      title: "4. The SBA Group Project Clash",
      story: "On Saturday afternoon, Winnie's school team needs to finish their Form 5 English SBA presentation. At the same time, an indie cafe offers Winnie $500 to perform live!",
      choiceA: {
        text: "Choose Singing: Skip the school meeting to earn $500 singing at the cafe.",
        feeling: "Winnie earned quick money, but her group members report her absence. The teacher calls Winnie's mother. Her mom cries: 'Why are you being so irresponsible?'",

        next: "9"
      },
      choiceB: {
        text: "Choose Studying: Turn down the cafe gig and finish the presentation with her team.",
        feeling: "Her team finishes the project with a Grade A! Her parents praise her over dinner: 'Good job putting your duty first.' Winnie feels respected by her friends.",

        next: "9"
      }
    },
    "9": {
      track: "School Path (Balancing Act)",
      badgeClass: "badge-school",
      title: "5. Form 6 Mock Exam Week Breakdown",
      story: "The hardest Form 6 mock exams start next Monday. Winnie feels completely burnt out and stressed from months of juggling music and revision. Her mother knocks on her door with warm herbal soup.",

        text: "Lock the door and shout: 'Leave me alone! Music is the only thing that cares about me!'",

        next: "10"
      },
      choiceB: {
        text: "Open the door, drink the soup with mom, and honestly share her exam worries.",
        feeling: "Mom hugs Winnie gently: 'We just want you to have a good future. Let's get through this together.' Winnie feels deeply comforted and sleeps well.",

    },
    "10": {
      track: "The Ultimate Crossroads",
      badgeClass: "badge-school",
      title: "6. Graduation Day: Stage or University?",
      story: "Graduation day! Winnie completes Form 6 and holds her official secondary diploma! Through all the conflicts, compromises, and late nights, she has finally earned her qualification. Now, standing at the crossroads of her life, Winnie must make her final choice:",
      choiceA: {
        text: "Decision: Pursue a full-time singing career now, using her diploma as a safety net!",
        feeling: "Winnie steps onto the stage with real maturity. She has both musical talent and a recognized qualification to protect her future!",

        next: "end_school_singing"
      },
      choiceB: {
        text: "Decision: Enter university/college for further study, and sing as an active semi-pro artist!",
        feeling: "Winnie enters higher education excited to learn, while continuing to write and perform songs with peace of mind!",
        music: 2, study: 4, family: 3,
        next: "end_school_study"
      }
    }
  };

  var state = {
    currentNodeId: "1",
    music: 0,
    study: 0,
    family: 0
  };

  var app = document.getElementById("game-app");

  function renderStart() {
    app.innerHTML = [
      '<h1>WINNIE\\\'S CHOICE</h1>',
      '<p class="subtitle">School Uniform or Stage Spotlight?</p>',
      '<div class="canvas-wrap"><canvas id="scene-canvas" width="280" height="150"></canvas></div>',
      '<div class="story-card">',
      '  <p>Winnie is a 15-year-old Form 4 student whose biggest passion is singing.</p><br/>',
      '  <p>If she drops out, she faces life alone without a diploma. But even if she stays in school, balancing study and singing causes real family conflicts. Can she manage both?</p>',
      '</div>',
      '<button id="start-btn" class="btn-action">START STORY ➔</button>'
    ].join('\\n');

    drawCartoon("scene-canvas", "start");

    document.getElementById("start-btn").onclick = function() {
      state.currentNodeId = "1";
      state.music = 0;
      state.study = 0;
      state.family = 0;
      renderCurrentNode();
    };
  }

  function renderCurrentNode() {
    var node = nodes[state.currentNodeId];

    app.innerHTML = [
      '<div class="status-bar">',
      '  <div>🎤 Music: <b>' + state.music + '</b></div>',
      '  <div>📚 Study: <b>' + state.study + '</b></div>',
      '  <div>👨‍👩‍👧 Family Bond: <b>' + state.family + '</b></div>',
      '</div>',
      '<div style="text-align:center;"><span class="track-badge ' + node.badgeClass + '">' + node.track + '</span></div>',
      '<div class="canvas-wrap"><canvas id="scene-canvas" width="280" height="150"></canvas></div>',
      '<h2 style="font-size:1.1rem; margin-bottom:10px; color:var(--primary);">' + node.title + '</h2>',
      '<div class="story-card"><p>' + node.story + '</p></div>',
      '<div id="feeling-display" class="feeling-box"></div>',
      '<div class="options" id="choice-buttons">',
      '  <button id="btn-choice-a"><b>Choice A:</b> ' + node.choiceA.text + '</button>',
      '  <button id="btn-choice-b"><b>Choice B:</b> ' + node.choiceB.text + '</button>',
      '</div>',
      '<button id="next-btn" class="btn-action" style="display:none;">CONTINUE STORY ➔</button>'
    ].join('\\n');

    drawCartoon("scene-canvas", state.currentNodeId);

    document.getElementById("btn-choice-a").onclick = function() { selectChoice('A'); };
    document.getElementById("btn-choice-b").onclick = function() { selectChoice('B'); };
  }

  function selectChoice(opt) {
    var node = nodes[state.currentNodeId];
    var chosen = (opt === 'A') ? node.choiceA : node.choiceB;

    state.music += chosen.music;
    state.study += chosen.study;
    state.family += chosen.family;

    var feelingBox = document.getElementById("feeling-display");
    feelingBox.innerHTML = '<b>Winnie\\\'s Feelings:</b> "' + chosen.feeling + '"';
    feelingBox.style.display = "block";

    document.getElementById("choice-buttons").style.display = "none";
    var nextBtn = document.getElementById("next-btn");
    nextBtn.style.display = "block";

    nextBtn.onclick = function() {
      if (chosen.next.indexOf("end_") === 0) {
        renderEnding(chosen.next);
      } else {
        state.currentNodeId = chosen.next;
        renderCurrentNode();
      }
    };
  }

  function renderEnding(endingKey) {
    var title = "";
    var desc = "";
    var sacrifice = "";
    var pros = "";
    var difficulties = "";

    if (endingKey === "end_school_singing") {
      if (state.family >= 4) {
        title = "Ending: Full-Time Singer with Warm Family Blessing!";
        desc = "Winnie earned her Form 6 diploma and proved her dedication to her parents through good communication. Seeing her maturity and safety net in hand, her parents proudly support her full-time singing career!";
        sacrifice = "Sacrificed late-night leisure time and had to compromise during exams.";
        pros = "A real diploma safety net, genuine musical grit, and full parental love.";
        difficulties = "Breaking into the music industry is tough, but she has the emotional resilience and education to succeed.";
      } else {
        title = "Ending: Full-Time Singer with Strained Family Ties";
        desc = "Winnie completed Form 6 and got her diploma, but her frequent broken promises and secret spending hurt her parents' trust. She signs a singing deal, but the dinner table at home remains quiet and tense.";
        sacrifice = "Damaged trust and emotional distance with parents.";
        pros = "Has her diploma and is pursuing her music dream.";
        difficulties = "Has to build her music career without strong family warmth and emotional backing.";
      }
    } else if (endingKey === "end_school_study") {
      if (state.family >= 4) {
        title = "Ending: The University Artist & Proud Family!";
        desc = "Winnie entered university with her parents cheering happily by her side! She continues to write songs, perform in campus music festivals, and releases music online with zero financial stress.";
        sacrifice = "Maintained continuous study discipline throughout Form 4 to Form 6.";
        pros = "Higher education degree pathways, vibrant university life, lifelong friendships, and strong family bond.";
        difficulties = "Balancing university assignments with rehearsals requires ongoing good time management.";
      } else {
        title = "Ending: The Reluctant University Student";
        desc = "Winnie enters college mainly to stop arguments with her parents. While she has a safe educational future, she secretly regrets not communicating her passion more effectively with her family.";
        sacrifice = "Felt like she gave up part of her musical spark due to repeated family fights.";
        pros = "Solid tertiary education and stable career pathways.";
        difficulties = "Finding peace between what her parents want and what she truly loves.";
      }
    } else if (endingKey === "end_dropout_reunion") {
      title = "Ending: A Humbled Heart & Second Chance";
      desc = "After experiencing the harsh difficulties of living without a diploma, Winnie apologized to her parents and returned home. Her parents welcomed her with tears and enrolled her in evening school to finish her education.";
      sacrifice = "Lost two years of regular school life and suffered low-wage physical labor.";
      pros = "Repaired her relationship with her parents and learned the true value of education.";
      difficulties = "Must study extra hard at night while working part-time to catch up.";
    } else {
      title = "Ending: The Regretful Dropout";
      desc = "Winnie dropped out of Form 4 and severed contact with her parents. Without a Form 6 certificate, she was trapped in underpaid dishwashing jobs and could not afford to pursue her music dreams.";
      sacrifice = "Gave up secondary education, family warmth, and future safety net.";
      pros = "Early independence.";
      difficulties = "Severe debt, loneliness, lack of qualifications, and deep regret.";
    }

    app.innerHTML = [
      '<div style="text-align:center; color:var(--primary); font-weight:bold; margin-bottom:8px;">JOURNEY CONCLUDED</div>',
      '<h1>' + title + '</h1>',
      '<p class="subtitle">Winnie\\\'s Story Summary</p>',
      '<div class="status-bar">',
      '  <div>🎤 Final Music: <b>' + state.music + '</b></div>',
      '  <div>📚 Final Study: <b>' + state.study + '</b></div>',
      '  <div>👨‍👩‍👧 Family Bond: <b>' + state.family + '</b></div>',
      '</div>',
      '<div class="story-card">',
      '  <p style="font-size:1.02rem; line-height:1.7;">' + desc + '</p>',
      '  <hr style="border:0; border-top:1px solid #334155; margin:16px 0;" />',
      '  <p style="color:#fde047; font-weight:600; margin-bottom:4px;">⚖️ What Happened to Her Education:</p>',
      '  <p style="color:#f1f5f9; margin-bottom:12px;">' + sacrifice + '</p>',
      '  <p style="color:#86efac; font-weight:600; margin-bottom:4px;">✔ Benefits & Wins:</p>',
      '  <p style="color:#f1f5f9; margin-bottom:12px;">' + pros + '</p>',
      '  <p style="color:#fca5a5; font-weight:600; margin-bottom:4px;">✘ Difficulties Faced:</p>',
      '  <p style="color:#f1f5f9;">' + difficulties + '</p>',
      '</div>',
      '<button id="restart-btn" class="btn-action">PLAY AGAIN (TRY ANOTHER PATH)</button>'
    ].join('\\n');

    document.getElementById("restart-btn").onclick = function() {
      renderStart();
    };
  }

  renderStart();
})();
</script>
</body>
</html>
